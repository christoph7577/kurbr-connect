openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: KURBR API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job management
  - name: haulers
    description: Hauler management
  - name: profile
    description: User profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: haulerId
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/track/{token}:
    get:
      operationId: trackJob
      tags: [jobs]
      summary: Public tracking by token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicJobStatus"
        "404":
          description: Not found

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get job statistics
      responses:
        "200":
          description: Job stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  /jobs/estimate:
    post:
      operationId: estimateJobPrice
      tags: [jobs]
      summary: Get AI-powered price estimate for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: AI price estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiEstimate"

  /haulers:
    get:
      operationId: listHaulers
      tags: [haulers]
      summary: List all hauler profiles
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: List of haulers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hauler"
    post:
      operationId: createHauler
      tags: [haulers]
      summary: Create a hauler profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HaulerInput"
      responses:
        "201":
          description: Created hauler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hauler"

  /haulers/me:
    get:
      operationId: getMyHaulerProfile
      tags: [haulers]
      summary: Get the current user's hauler profile
      responses:
        "200":
          description: Hauler profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hauler"
        "404":
          description: Not found

  /haulers/{id}:
    patch:
      operationId: updateHauler
      tags: [haulers]
      summary: Update a hauler profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HaulerUpdate"
      responses:
        "200":
          description: Updated hauler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hauler"

  /profile/me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Job:
      type: object
      required: [id, jobNumber, serviceType, address, status, createdAt]
      properties:
        id: { type: string }
        jobNumber: { type: string }
        trackingToken: { type: string }
        serviceType: { type: string }
        address: { type: string }
        scheduledDate: { type: ["string", "null"] }
        scheduledTime: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        customerEmail: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        customerId: { type: ["string", "null"] }
        haulerId: { type: ["string", "null"] }
        priceCents: { type: ["integer", "null"] }
        photos:
          type: ["array", "null"]
          items: { type: string }
        aiEstimate:
          type: ["object", "null"]
          additionalProperties: true
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    PublicJobStatus:
      type: object
      required: [jobNumber, trackingToken, status, serviceType, address]
      properties:
        jobNumber: { type: string }
        trackingToken: { type: string }
        status: { type: string }
        serviceType: { type: string }
        address: { type: string }
        scheduledDate: { type: ["string", "null"] }
        scheduledTime: { type: ["string", "null"] }
        priceCents: { type: ["integer", "null"] }

    JobInput:
      type: object
      required: [serviceType, address]
      properties:
        serviceType: { type: string }
        address: { type: string }
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        description: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string }
        priceCents: { type: integer }
        photos:
          type: array
          items: { type: string }
        aiEstimate:
          type: object
          additionalProperties: true

    JobUpdate:
      type: object
      properties:
        status: { type: string }
        haulerId: { type: ["string", "null"] }
        scheduledDate: { type: string }
        scheduledTime: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        photos:
          type: array
          items: { type: string }
        aiEstimate:
          type: object
          additionalProperties: true

    JobStats:
      type: object
      required: [total, active, unassigned, completed, todayRevenueCents, activeHaulers, dailyRevenue]
      properties:
        total: { type: integer }
        active: { type: integer }
        unassigned: { type: integer }
        completed: { type: integer }
        todayRevenueCents: { type: integer }
        activeHaulers: { type: integer }
        dailyRevenue:
          type: array
          items:
            type: object
            required: [date, totalCents]
            properties:
              date: { type: string }
              totalCents: { type: integer }

    PhotoUploadResponse:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items: { type: string }

    EstimateRequest:
      type: object
      required: [photoUrls, serviceType]
      properties:
        photoUrls:
          type: array
          items: { type: string }
        serviceType: { type: string }
        description: { type: string }

    AiEstimate:
      type: object
      required: [estimated_volume, item_list, difficulty_score, price_min, price_max, price_estimated]
      properties:
        estimated_volume: { type: string }
        item_list:
          type: array
          items: { type: string }
        difficulty_score: { type: integer }
        price_min: { type: integer }
        price_max: { type: integer }
        price_estimated: { type: integer }

    Hauler:
      type: object
      required: [id, userId, status, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        businessName: { type: ["string", "null"] }
        licenseNumber: { type: ["string", "null"] }
        vehicleType: { type: ["string", "null"] }
        vehiclePlate: { type: ["string", "null"] }
        serviceAreas: { type: array, items: { type: string } }
        backgroundCheckConsent: { type: boolean }
        backgroundCheckDate: { type: ["string", "null"] }
        trainingCompleted: { type: boolean }
        trainingCompletedDate: { type: ["string", "null"] }
        status: { type: string }
        profileName: { type: ["string", "null"] }
        profileEmail: { type: ["string", "null"] }
        createdAt: { type: string }

    HaulerInput:
      type: object
      required: [vehicleType, vehiclePlate, serviceAreas]
      properties:
        businessName: { type: string }
        licenseNumber: { type: string }
        vehicleType: { type: string }
        vehiclePlate: { type: string }
        serviceAreas: { type: array, items: { type: string } }
        backgroundCheckConsent: { type: boolean }
        trainingCompleted: { type: boolean }
        documents:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              uploaded: { type: boolean }

    HaulerUpdate:
      type: object
      properties:
        status: { type: string }
        businessName: { type: string }
        vehicleType: { type: string }
        vehiclePlate: { type: string }

    UserProfile:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        fullName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role: { type: string }
