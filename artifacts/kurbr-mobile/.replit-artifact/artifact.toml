kind = "mobile"
previewPath = "/mobile/"
title = "KURBR Mobile"
version = "1.0.0"
id = "artifacts/kurbr-mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 3000
router = "expo-domain"

[services.development]
run = "pnpm --filter @workspace/kurbr-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kurbr-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kurbr-mobile", "run", "serve" ]

[services.env]
PORT = "3000"
BASE_PATH = "/mobile/"
